name: Build Release

# Triggers:
#   1. Push a v* tag (e.g. git tag v1.0.0 && git push --tags) -> build + publish GitHub Release
#   2. Manual trigger (Actions -> Run workflow) -> build + upload artifact only, no Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # Required to create GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tl_chat
        uses: actions/checkout@v5 # v5 runs on Node 24, avoids the Node 20 deprecation warning from v4

      - name: Checkout tailscale_dart fork into path-dependency location (../tailscale_dart)
        # actions/checkout@v4 disallows `path` escaping the workspace dir (the ../ sibling
        # syntax fails with "not under the workspace"). Use plain git clone instead.
        run: |
          git clone --depth 1 https://github.com/42419/tailscale_dart.git ../tailscale_dart
          echo "tailscale_dart @ $(git -C ../tailscale_dart rev-parse --short HEAD)"

      - name: Set up JDK 17 (required by AGP 9 / Gradle 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go (tailscale native build hook needs Go 1.26+)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # go.mod declares go 1.26.4; use the x wildcard in case the exact patch is unavailable
          # Note: no cache-dependency-path set — go.sum lives in ../tailscale_dart (outside the
          # workspace), so setup-go's glob cannot match it; setting it may even error. Go deps
          # re-download each run (slower CI, but acceptable).

      - name: Set up Flutter (pinned version for deterministic native-assets hook behavior)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Install Android NDK and accept licenses
        shell: bash
        run: |
          SDKMGR="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          # Failing to accept licenses should not block (runner usually has them), but the NDK
          # must be installed or the tailscale hook fails.
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            "$SDKMGR" --install "ndk;27.2.12479018" >/dev/null 2>&1 \
              || "$SDKMGR" --install "ndk;26.1.10909125"
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::Android NDK not installed; tailscale build hook cannot compile the native library"
            exit 1
          fi
          echo "NDK: ${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | tail -1)}"

      - name: Dependencies, analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Compute version (from tag if present, e.g. v1.0.0+3 -> name=1.0.0 number=3)
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          NAME="${VER%%+*}"
          NUM="${VER#*+}"
          [[ "$NUM" == "$VER" ]] && NUM="1"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build split-per-ABI APKs (arm64-v8a / armeabi-v7a / x86_64)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name ${{ steps.ver.outputs.name }} \
            --build-number ${{ steps.ver.outputs.number }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tl-chat-apk-${{ steps.ver.outputs.name }}
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TL Chat ${{ steps.ver.outputs.name }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
